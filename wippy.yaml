organization: chicago
module: run
description: The Start menu's Run… dialog of the Windows 95 shell (chicago/shell) — a command field that launches the command in its own Bash window of the desktop base; a dialog on the shell SDK, with its tests.
license: MIT
repository: https://github.com/chicago-desktop/run
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - chicago
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries named under `embed:`. The image pack lives outside src/ and is
# packed only when named here (fs.directory -> fs.embed).
embed:
  - chicago.run:images
