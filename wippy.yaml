organization: windows
module: run
description: The Start menu's Run… dialog of the Windows 95 shell (windows/shell) — a command field that launches the command in its own Bash window of the desktop base; a dialog on the shell SDK, with its tests.
license: MIT
repository: https://github.com/wippy-windows/run
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - windows
# No `version:` here — the publisher picks it (`wippy publish` bumps the
# latest published one). A published version is immutable.
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# `wippy publish` packs the entries of src/ and embeds only the fs.directory
# entries named under `embed:`. This module has no pictures of its own — the
# dialog's icon is the shell's `run` — so there is nothing to embed.
