version: "1.0"
namespace: app

# Standalone harness for windows/run. Provides the host resources
# the boot needs (app:db, app:processes, a gateway and a router for the
# shell's endpoints, env storage, a permissive actor scope) and runs the
# co-located *_test.lua suites. Excluded from publish by the module's
# wippy.yaml.
#
# Every test entry is a function.lua with `meta.type: test`; `wippy test`
# runs the ones it discovers. A test file must be in the run_cases form
# (see run_test.lua) — the other form is counted, printed green and never
# executed.

entries:
  - name: definition
    kind: ns.definition
    meta: {title: Run Test Harness}

  - name: run_test
    kind: function.lua
    meta:
      type: test
      comment: "The Run dialog — the launch spec, the SDK layout and the default-button rule, Browse… against a substituted compositor, the real Start menu and a real Bash under a PTY that survives the dialog closing, Esc in cells mode."
      group: Run
      suite: windows_run
    source: file://run_test.lua
    method: run
    modules: [process, channel, time, tty, fs, gfx]
    imports:
      test: wippy.test:test
      model: windows.run:model
      ui: windows.shell.sdk:ui
      run_window: windows.run:window

  - name: run_composer
    kind: process.lua
    meta:
      comment: The real compositor and the shell menu on the test viewport, reporting the menu's hit spots and the dialog's frames to the test.
    source: file://run_composer.lua
    method: main
    modules: [process, fs, gfx]
    imports:
      library: windows.tui_desktop.desktop:library
      chrome: windows.shell.theme:chrome_pixels
      cell_chrome: windows.shell.theme:chrome
      catalog: windows.shell.programs:catalog

  - name: window_test
    kind: function.lua
    meta:
      type: test
      comment: "The dialog's registry entry as the Start menu reads it (Run… at the root, a dialog, the shell's picture found by the shell), the process running the definition, and test/shots/run.png drawn by the shell's renderer."
      group: Run
      suite: windows_run
    source: file://window_test.lua
    method: run
    # Reading the shell's image pack takes `registry.get` as well as `fs.get`,
    # and `gfx` to decode the picture; the shot reads the font from
    # app:system_fonts and writes the PNG to app:shots.
    modules: [gfx, fs, registry]
    imports:
      test: wippy.test:test
      app: windows.shell.sdk:app
      ui: windows.shell.sdk:ui
      render: windows.shell.sdk:render
      rasters: windows.shell.theme:rasters
      images: windows.shell.theme:images
      window: windows.run:window

  - name: shots
    kind: fs.directory
    meta:
      comment: Where the window's shot goes.
    base: project
    directory: ./shots
    auto_init: true

  - name: system_fonts
    kind: fs.directory
    meta:
      comment: System TrueType fonts, read-only — the font arrives in gfx as bytes, not as a path.
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the dialog does not use it, but the shell's migrations ask for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The shell's endpoint entries resolve against these at boot; no suite calls
  # them. The port is apart from the shell harness's :19229, the template's
  # :19239 and the other modules' harnesses, so they can run side by side.
  - name: gateway
    kind: http.service
    addr: :19248
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness tests the module, so it depends on it; the replacement in
  # .wippy.yaml substitutes the working copy from ../.
  - name: run_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "windows/run"

  - name: run_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migrations the shell brings.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: run_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: run_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
